name: Mantle Intel Agent Pipeline

on:
  schedule:
    # Runs every 5 minutes (the fastest frequency allowed by GitHub)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit data back to the repo
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct Keystore
        env:
          PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # The agent requires a keystore for secure on-chain submission
          python -c "
          import os, json
          from eth_account import Account
          Account.enable_unaudited_hdwallet_features()
          pk = os.environ.get('PRIVATE_KEY')
          pwd = os.environ.get('KEYSTORE_PASSWORD')
          if pk and pwd:
              keystore = Account.encrypt(pk, pwd)
              with open('keystore.json', 'w') as f:
                  json.dump(keystore, f)
          "

      - name: Run Mantle Intel Pipeline (1 Cycle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Run exactly one pipeline cycle (fetches latest blocks, detects anomalies, submits)
          python -m agents.pipeline --mode once

      - name: Commit and Push Data Updates
        run: |
          git config --global user.name "Mantle Intel Bot"
          git config --global user.email "bot@mantle-intel.agent"
          
          # Only commit if the data/ folder changed (new findings)
          if [[ `git status --porcelain data/` ]]; then
            git add data/
            git commit -m "chore: auto-update on-chain submissions data"
            git push
          else
            echo "No new anomalies detected in this cycle."
          fi
