name: Mantle Intel Agent Pipeline

on:
  schedule:
    # Runs every 5 minutes (the fastest frequency allowed by GitHub)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mantle Intel Pipeline (1 Cycle)
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "6774697368"
          AUDIT_CONTRACT_ADDRESS: "0x7266cD152e08Ae7005256Aa598d4eFE110Ed530b"
          AUDIT_RPC_URL: "https://rpc.sepolia.mantle.xyz"
          MANTLE_TESTNET_RPC: "https://rpc.sepolia.mantle.xyz"
          MANTLE_RPC_URL: "https://rpc.mantle.xyz"
          NETWORK: "testnet"
        run: |
          python main.py --cycles 1 --bot

      - name: Commit and Push Data Updates
        run: |
          git config --global user.name "Mantle Intel Bot"
          git config --global user.email "bot@mantle-intel.agent"

          # Only commit if the data/ folder changed (new findings)
          if [[ `git status --porcelain data/` ]]; then
            git add data/
            git commit -m "chore: auto-update on-chain submissions data"
            git push
          else
            echo "No new anomalies detected in this cycle."
          fi
