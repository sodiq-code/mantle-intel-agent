# ── P3-34: Modern Python packaging with PEP 621 ───────────────────────────────
# This file is the single source of truth for project metadata and dependencies.
# requirements.txt is generated from this file via: pip-compile pyproject.toml
# Install editable: pip install -e .
# Install with extras: pip install -e ".[dev,otel]"

[build-system]
requires = ["setuptools>=75.0", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "mantle-intel-agent"
version = "2.0.0"
description = "Autonomous 5-agent AI pipeline for on-chain anomaly detection on Mantle Network"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jimoh Tech", email = "sodiq.code@gmail.com" },
]
keywords = ["mantle", "blockchain", "anomaly-detection", "defi", "on-chain-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# Note: License classifier removed — PEP 639 supersedes it;
# the [project].license = "MIT" field is the single source of truth.

# ── Core Dependencies ──────────────────────────────────────────────────────────
dependencies = [
    # Core
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "pydantic>=2.0.0",

    # Web3 / Blockchain
    "web3>=6.15.0,<7.0.0",
    # Note: web3 6.x requires eth-account<0.13, eth-typing<5, eth-utils<5, hexbytes<0.4
    "eth-account>=0.8.0,<0.13",
    "eth-hash[pycryptodome]>=0.5.1",
    "eth-typing>=3.0.0,<5.0.0",
    "eth-utils>=2.1.0,<5",
    "hexbytes>=0.1.0,<0.4.0",

    # Machine Learning (Anomaly Detection)
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "joblib>=1.4.0",

    # HTTP
    "httpx>=0.27.0",
    "requests>=2.31.0",

    # API Server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Telegram Bot
    "python-telegram-bot>=21.3",

    # Data & Visualization
    "pandas>=2.2.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
# OpenTelemetry observability (P2-16)
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

# Rate limiting (P2-19)
ratelimit = [
    "slowapi>=0.1.9",
]

# Development tools
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pip-tools>=7.4",
]

# All optional dependencies
all = [
    "mantle-intel-agent[otel,ratelimit,dev]",
]

[project.scripts]
mantle-intel = "server:main"

[project.urls]
Homepage = "https://github.com/sodiq-code/mantle-intel-agent"
Documentation = "https://github.com/sodiq-code/mantle-intel-agent/tree/main/docs"
Repository = "https://github.com/sodiq-code/mantle-intel-agent"
Dashboard = "https://mantle-intel-agent.vercel.app"
BugTracker = "https://github.com/sodiq-code/mantle-intel-agent/issues"

# ── setuptools config ──────────────────────────────────────────────────────────
[tool.setuptools]
packages = { find = { include = ["agents*", "bot*", "backtest*"] } }
py-modules = ["server", "config", "main"]

[tool.setuptools.package-data]
agents = ["py.typed"]
bot = ["py.typed"]

# ── Ruff linter (replaces flake8 + isort + black) ──────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agents", "bot", "backtest", "scripts", "server.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends pattern)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "bot", "backtest"]

# ── pytest configuration ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:web3.*",
    "ignore::DeprecationWarning:eth_utils.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring RPC",
]

# ── pip-compile (generate requirements.txt from this file) ─────────────────────
# Run: pip-compile pyproject.toml -o requirements.txt
# Run with extras: pip-compile pyproject.toml --extra otel --extra ratelimit -o requirements.txt
